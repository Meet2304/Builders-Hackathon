name: scorer-lab
on:
  push:
    branches: ['lab/**']
  workflow_dispatch: {}
concurrency:
  group: scorer-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: v16,    ref: v16, cpu: x86-64-v3 }
          - { name: v17pre, ref: integ/v17, cpu: x86-64-v3 }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ matrix.ref }}', fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { path: labtree }
      - id: key
        run: echo "k=bin4-${{ matrix.name }}-${{ matrix.cpu }}-${{ matrix.pgo || 'off' }}-${{ hashFiles('src/**','Cargo.lock','Dockerfile','docker/**') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: cache
        with:
          path: bin
          key: ${{ steps.key.outputs.k }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p bin
          docker build --build-arg X86_CPU=${{ matrix.cpu }} ${{ matrix.pgo && format('--build-arg PGO={0}', matrix.pgo) || '' }} -t img .
          id=$(docker create img); docker cp $id:/app/sessions bin/sessions; docker rm $id
          file bin/sessions; ls -la bin
      - uses: actions/upload-artifact@v4
        with: { name: 'bin-${{ matrix.name }}', path: bin/sessions, retention-days: 3 }

  bench:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; free -g; df -h / /mnt || true
          cat /proc/cpuinfo | head -30
          grep -m1 'model name' /proc/cpuinfo
          grep -o -m1 -w 'avx512f' /proc/cpuinfo && echo AVX512=yes || echo AVX512=no
          cat /sys/kernel/mm/transparent_hugepage/enabled
          docker version --format '{{.Server.Version}}'
          uname -r
      - uses: actions/download-artifact@v4
        with: { path: bins }
      - name: Images
        run: |
          set -eux
          docker pull -q debian:bookworm-slim
          for d in bins/bin-*; do
            n=${d#bins/bin-}; mkdir -p ctx/$n; cp $d/sessions ctx/$n/; chmod 755 ctx/$n/sessions
            docker build -q -f .github/bench/Dockerfile.run -t ss:$n ctx/$n
          done
          docker images | grep ss
      - uses: actions/cache@v4
        id: data20
        with:
          path: data/seed-42
          key: data-seed42-20m-${{ hashFiles('tools/generator/src/**','tools/generator/Cargo.lock') }}
      - name: Generate 20M
        if: steps.data20.outputs.cache-hit != 'true'
        run: |
          set -eux
          (cd tools/generator && cargo build --release -q)
          time tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output data/seed-42
          du -sh data/seed-42; ls -la data/seed-42
      - uses: actions/cache@v4
        id: data60
        with:
          path: data/seed-99
          key: data-seed99-60m-${{ hashFiles('tools/generator/src/**','tools/generator/Cargo.lock') }}
      - name: Generate 60M
        if: steps.data60.outputs.cache-hit != 'true'
        run: |
          set -eux
          (cd tools/generator && cargo build --release -q)
          time tools/generator/target/release/generate --seed 99 --events 60000000 --clicks 15000000 --output data/seed-99
          du -sh data/seed-99
      - name: Bench
        run: bash .github/bench/bench2.sh 2>&1 | tee bench.log
      - name: Summary
        if: always()
        run: python3 .github/bench/summarize.py results.jsonl | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results.jsonl
            bench.log
            logs/
