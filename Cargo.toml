[package]
name = "sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
parquet = { version = "60.2.0", default-features = false, features = ["arrow"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
